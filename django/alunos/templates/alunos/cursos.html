{% extends 'alunos/base.html' %}

{% block title %}
Cursos | Portal de Cursos
{% endblock %}

{% block content %}

<section class="container py-5">

  <div class="row g-4">
    {% for curso in cursos %}

    <div class="col-md-6 col-lg-4">
      <article class="card h-100 shadow-sm">
        <div class="card-body">
          <h2 class="h5">{{ curso.titulo }}</h2>

          <p class="card-text">
            Carga horária: {{ curso.carga_horaria }} horas
          </p>
          <a class="btn btn-primary" href="#">Saiba mais</a>
        </div>
      </article>
    </div>

    {% empty %}

    <p>Nenhum curso disponível.</p>
    {% endfor %}
  </div>
  
</section>

{% endblock %}
